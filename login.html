<!DOCTYPE html>
<html>
  <head>
    <title>Create User with Auth</title>
  </head>
  <body>
    <h2>Create User (Auth via Token)</h2>

    <input id="email" placeholder="email" />
    <input id="password" type="password" placeholder="pass" />
    <button id="loginBtn">Login</button>

    <p id="message"></p>

    <script>
      const endpoint = "http://localhost:4000/"; // GraphQL серверийн URL

      const loginBtn = document.getElementById("loginBtn");
      const message = document.getElementById("message");

      loginBtn.addEventListener("click", async () => {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        console.log(email);
        // localStorage-аас token-г авна
        // const token = localStorage.getItem("authToken");
        // if (!token) {
        //   message.textContent = "No token found! Please login first.";
        //   return;
        // }

        // GraphQL mutation
        const mutation = `
          mutation LoginUser($input: LoginInput) {
            loginUser(input: $input) {
              message
              token
            }
          }
        `;

        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              // Authorization: `Bearer ${token}`, // token-г localStorage-аас авсан
            },
            body: JSON.stringify({
              query: mutation,
              variables: {
                input: {
                  email: email,
                  password: password,
                },
              },
            }),
          });

          const result = await response.json();
          console.log(result);

          if (result.data && result.data.createStudent) {
            const student = result.data.createStudent;
            message.textContent = `Student created: ${student.name}, Age: ${student.age}, Grade: ${student.grade}`;
          } else {
            message.textContent =
              "Failed to create student! Check token or input.";
          }
        } catch (error) {
          console.error(error);
          message.textContent = "Error connecting to server";
        }
      });
      const signup = async () => {
        window.location.href = "./signup.html";
      };
    </script>

    <p><button id="1" onclick="signup()">Signup</button></p>
  </body>
</html>
